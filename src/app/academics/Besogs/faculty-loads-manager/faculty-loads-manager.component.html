<mat-card class="faculty-loads-card">
  <mat-card-header>
    <mat-card-title><p><b>Faculty Loads Manager</b></p></mat-card-title>
    <mat-card-subtitle><p>Assign loads and view your faculty members.</p></mat-card-subtitle>
  </mat-card-header>

  <mat-tab-group>
    <mat-tab label="Assign Loads">
      <ng-template matTabContent>
        <div class="tab-content">
          <app-assign-loads></app-assign-loads>
        </div>
      </ng-template>
    </mat-tab>

    <mat-tab label="My Faculty Members">
      <ng-template matTabContent>
        <div class="tab-content">
          <app-my-faculty></app-my-faculty>
        </div>
      </ng-template>
    </mat-tab>
  </mat-tab-group>
</mat-card>
