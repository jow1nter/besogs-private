<form class="section-dialog-form" (ngSubmit)="saveSection()">
    <div class="section-dialog-heading">
        <h2 id="section-dialog-title">{{ editingId === null ? 'Add Section' : 'Edit Section' }}</h2>
        <button mat-icon-button type="button" aria-label="Close dialog" (click)="closeSectionDialog()">
            <mat-icon>close</mat-icon>
        </button>
    </div>
    <!-- <p class="section-dialog-description">Manage sections for {{ selectedYear }}.</p> -->
    <mat-dialog-content class="section-dialog-content">
        <mat-form-field appearance="outline" class="grade-field x">
            <mat-label>Year Level</mat-label>
            <mat-select name="yearLevel" [(ngModel)]="draftGrade">
                <mat-option *ngFor="let grade of gradeLevels" [value]="grade">{{ grade }}</mat-option>
            </mat-select>
        </mat-form-field>
        <div class="section-name-row" *ngFor="let row of draftSections; let i = index">
            <mat-form-field appearance="outline" class="section-name-field x">
                <mat-label>Section Name</mat-label>
                <input matInput [name]="'sectionName' + i" [(ngModel)]="row.name"
                    [attr.aria-label]="'Section name ' + (i + 1)"
                    [attr.aria-describedby]="error ? 'section-dialog-error' : null">
            </mat-form-field>
            <mat-form-field appearance="outline" class="adviser-field x">
                <mat-label>Adviser</mat-label>
                <input matInput [name]="'adviser' + i" [(ngModel)]="row.adviser"
                    [attr.aria-label]="'Adviser for section ' + (i + 1)">
            </mat-form-field>
            <button *ngIf="editingId === null" mat-icon-button type="button"
                [attr.aria-label]="'Remove section ' + (i + 1)"
                (click)="removeSectionRow(i)"><mat-icon>delete_outline</mat-icon></button>
        </div>
        <button *ngIf="editingId === null" mat-stroked-button type="button" class="add-section-row"
            (click)="addSectionRow()">
            <mat-icon>add</mat-icon> Add Section
        </button>
        <p *ngIf="error" id="section-dialog-error" class="error" role="alert">{{ error }}</p>
    </mat-dialog-content>
    <mat-dialog-actions align="end" class="section-dialog-actions">
        <!-- <button mat-button type="button" (click)="closeSectionDialog()">Cancel</button> -->
        <button mat-flat-button color="primary" type="submit" class="save-sections-button">{{ editingId === null ? 'Save Sections' :
            'Save Changes' }}</button>
    </mat-dialog-actions>
</form>
